<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<div class="container">
<h2>User Login</h2>

{% for m in get_flashed_messages() %}
<p style="color:red;">{{ m }}</p>
{% endfor %}

<form method="post">
<input name="voter_id" placeholder="Voter ID" required>
<input type="password" id="p" name="password" placeholder="Password" required>

<input type="checkbox" onclick="toggle()"> Show Password

<button>Login</button>
</form>

<p>Admin? <a href="/admin/login">Login here</a></p>
</div>

<script>
function toggle(){
let x=document.getElementById("p");
x.type=x.type==="password"?"text":"password";
}
</script>
